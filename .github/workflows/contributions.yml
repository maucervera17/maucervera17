name: Contribution graph

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-light.svg?palette=github-light&color_snake=#2f2bff&color_dots=#eef0f3,#c9c8ff,#8f8cff,#5a56ff,#2f2bff
            dist/contributions-dark.svg?palette=github-dark&color_snake=#8f8cff&color_dots=#161b22,#1d1b5e,#2f2bff,#5a56ff,#8f8cff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
