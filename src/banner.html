<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=block" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
  :root { --paper:#ffffff; --ink:#141414; --soft:rgba(20,20,20,.58); --hair:rgba(20,20,20,.12); --cobalt:#2f2bff; }
  body.dark { --paper:#000000; --ink:#ffffff; --soft:rgba(255,255,255,.62); --hair:rgba(255,255,255,.16); }
  html, body { margin:0; }
  body { width:1280px; height:420px; background:var(--paper); color:var(--ink); font-family:'Inter Tight',sans-serif; overflow:hidden; position:relative; }
  .wrap { position:absolute; inset:0; padding:56px 64px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; justify-content:space-between; font-size:17px; font-weight:500; color:var(--soft); letter-spacing:-.01em; }
  .top b { color:var(--ink); font-weight:600; }
  h1 { margin:0; font-size:118px; line-height:.9; font-weight:800; letter-spacing:-.055em; }
  .line { margin:22px 0 0; font-size:30px; font-weight:500; letter-spacing:-.025em; max-width:640px; line-height:1.12; }
  .line em { font-style:normal; color:var(--cobalt); }
  body.dark .line em { color:#8f8cff; }
  .pills { display:flex; gap:10px; }
  .pill { border:1px solid var(--hair); border-radius:999px; padding:9px 16px; font-size:15px; font-weight:500; letter-spacing:-.01em; }
  .pill.on { background:var(--cobalt); border-color:var(--cobalt); color:#fff; }
  canvas#duck { position:absolute; right:70px; top:20px; width:420px; height:400px; }
</style>
</head>
<body>
  <canvas id="duck"></canvas>
  <div class="wrap">
    <div class="top"><span><b>mau</b> &nbsp;/ maucervera.com</span><span>Mexico City</span></div>
    <div>
      <h1>Mau Cervera</h1>
      <p class="line">I design agents people can trust, <em>and I ship them.</em></p>
    </div>
    <div class="pills">
      <span class="pill on">Lead Product Designer, AI</span>
      <span class="pill">Head of Design at Leadgentic</span>
      <span class="pill">Ulika · WP Jarvis · Barasu</span>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { loadDuck } from './js/about-duck.js';
    if (location.hash === '#dark') document.body.classList.add('dark');
    const cv = document.getElementById('duck');
    const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(2); r.setSize(420, 400, false);
    r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(30, 420/400, 0.1, 50); cam.position.set(0, 0.35, 5.6); cam.lookAt(0, 0, 0);
    const d = await loadDuck(r);
    d.uni.uReveal.value = 1;
    d.pivot.rotation.set(0.08, -0.55, 0);
    scene.add(d.pivot);
    r.render(scene, cam); r.render(scene, cam);
    await document.fonts.ready;
    document.title = 'ready';
  </script>
</body>
</html>
